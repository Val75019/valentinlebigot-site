<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Valentin Lebigot</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/css/fonts.css?v=4.2">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Archivo", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: #161616;
      background: #fff;
      display: flex;
      -webkit-font-smoothing: antialiased;
      hyphens: none;
    }
    /* Les trois barres colorées, comme sur le site */
    .bars { display: flex; flex-direction: column; width: 12px; flex: none; }
    .bars span { flex: 1; transform-origin: top; animation: grow 1.1s cubic-bezier(.65,0,.35,1) both; }
    .bars span:nth-child(1) { background: #1c63d7; flex-grow: 5; }
    .bars span:nth-child(2) { background: #f4ebdd; flex-grow: 3; animation-delay: .12s; }
    .bars span:nth-child(3) { background: #93272a; flex-grow: 2; animation-delay: .24s; }
    @keyframes grow { from { transform: scaleY(0); } }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 6vw, 96px);
      animation: fade .8s .3s cubic-bezier(.22,.9,.24,1) both;
    }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } }
    .logo { width: 48px; height: auto; display: block; margin-bottom: clamp(36px, 6vh, 64px); }
    h1 {
      font-weight: 600;
      font-size: clamp(26px, 3.2vw, 44px);
      line-height: 1.15;
      margin: 0 0 18px;
      text-wrap: balance;
    }
    p {
      font-size: clamp(15px, 1.1vw, 17px);
      line-height: 1.6;
      color: #5c5c5c;
      margin: 0 0 36px;
      max-width: 34em;
      text-wrap: pretty;
    }
    .btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      background: #161616;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 999px;
      transition: transform .3s cubic-bezier(.22,.9,.24,1), background .3s;
    }
    .btn:hover { background: #1c63d7; transform: translateX(4px); }
    .btn span { transition: transform .3s cubic-bezier(.22,.9,.24,1); }
    .btn:hover span { transform: translateX(3px); }
    .note { margin-top: 22px; font-size: 13px; color: #a3a3a3; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    /* système typographique : grands titres en capitales étroites, italique en contrepoint */
    h1 { font-variation-settings: "wdth" 62; font-weight: 700; text-transform: uppercase; letter-spacing: -.005em; line-height: .94; }
    h1 em { font-variation-settings: normal; text-transform: none; font-weight: 400; font-size: 1.06em; }
  </style>
</head>
<body>
  <div class="bars" aria-hidden="true"><span></span><span></span><span></span></div>
  <main>
    <a href="/" aria-label="Accueil"><img class="logo" src="/assets/15-12-2025_logo-00-02.png" alt="Valentin Lebigot"></a>
    <h1>Cette page n’existe plus.</h1>
    <p>Le site a fait peau neuve&nbsp;: tous les projets sont maintenant réunis sur une seule page.</p>
    <a class="btn" href="/">Voir les projets <span aria-hidden="true">→</span></a>
    <div class="note" id="note">Redirection automatique dans <b id="sec">8</b>&nbsp;s</div>
  </main>
  <script>
    (function () {
      var s = 8, el = document.getElementById('sec');
      var t = setInterval(function () {
        s -= 1; el.textContent = s;
        if (s <= 0) { clearInterval(t); location.replace('/'); }
      }, 1000);
    })();
  </script>
</body>
</html>
